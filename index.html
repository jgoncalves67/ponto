<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SE & S — Registo de Ponto</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:#f0f2f5;color:#103a6b}

  /* LOGIN */
  .login-fundo{position:fixed;top:0;left:0;width:100%;height:100%;background:#103a6b;display:flex;align-items:center;justify-content:center;z-index:9999;padding:15px}
  .login-box{background:#fff;border-radius:15px;padding:30px;width:100%;max-width:360px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .login-box h1{font-size:26px;margin:0 0 5px}
  .login-box p{font-size:13px;color:#666;margin:0 0 20px}
  .login-box input{width:100%;padding:14px;font-size:16px;border:2px solid #b7c7de;border-radius:10px;margin-bottom:12px;text-align:left}
  .login-box button{width:100%;padding:14px;font-size:17px;font-weight:bold;background:#103a6b;color:#fff;border:none;border-radius:10px;cursor:pointer}
  .login-erro{color:#b02a2a;font-size:14px;margin-top:10px;display:none}

  /* APP */
  .app{padding:12px;max-width:700px;margin:0 auto}
  h2{font-size:17px;text-align:center;margin:10px 0}
  .card{background:#fff;border-radius:10px;padding:15px;margin-bottom:15px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
  label{font-weight:bold;font-size:14px;display:block;margin:10px 0 4px}
  input,select{width:100%;padding:12px;font-size:16px;border:1px solid #b7c7de;border-radius:8px;color:#103a6b;background:#fff;-webkit-appearance:none}
  .linha2{display:flex;gap:10px}
  .linha2>div{flex:1}
  button{width:100%;padding:14px;font-size:16px;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px;color:#fff;background:#103a6b}
  .btn-verde{background:#1a7a3d}
  .btn-cinza{background:#666}
  .btn-vermelho{background:#b02a2a}
  .btn-laranja{background:#d4820a}
  .btn-pequeno{width:auto;padding:8px 14px;font-size:13px;margin:0;display:inline-block}

  .tabs{display:flex;gap:5px;margin-bottom:12px}
  .tab{flex:1;text-align:center;padding:12px 5px;background:#dbe5f1;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer}
  .tab.ativo{background:#103a6b;color:#fff}

  .sync-status{text-align:center;font-size:13px;padding:7px;border-radius:6px;margin-bottom:12px;font-weight:bold}
  .sync-ok{background:#d4edda;color:#155724}
  .sync-off{background:#fff3cd;color:#856404}
  .sync-err{background:#f8d7da;color:#721c24}

  .registo{border-left:5px solid #103a6b;background:#fff;border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .registo.nsync{border-left-color:#d4820a}
  .registo .obra{font-weight:bold;font-size:15px}
  .registo .trab{font-size:14px;color:#1a7a3d;font-weight:bold}
  .registo .data{font-size:13px;color:#555}
  .registo .horas{font-size:14px;margin-top:4px}
  .registo .tot{font-weight:bold;color:#1a7a3d}
  .registo .obs{font-size:13px;color:#444;margin-top:4px;font-style:italic}
  .registo .acoes{float:right}
  .registo .acoes button{margin-left:5px}

  .resumo{background:#103a6b;color:#fff;border-radius:8px;padding:12px;text-align:center;font-weight:bold;margin-bottom:12px}
  .tabela-resumo{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;background:#fff;color:#103a6b;border-radius:6px;overflow:hidden}
  .tabela-resumo th{background:#0a2a4d;color:#fff;padding:7px;text-align:left}
  .tabela-resumo td{padding:7px;border-bottom:1px solid #ddd;text-align:left}
  .tabela-resumo tr:last-child td{font-weight:bold;background:#eef3f9}

  .item-lista{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
  .item-lista span{font-size:15px}
  .item-lista button{width:auto;margin:0 0 0 5px;padding:6px 12px;font-size:13px}

  .editando{border:2px solid #d4820a}

  @media print{
    .login-fundo,.tabs,button,.sync-status,#secPonto,.card-filtros{display:none!important}
    .app{padding:0}
    body{background:#fff}
  }
</style>
</head>
<body>

<!-- ==================== LOGIN ==================== -->
<div class="login-fundo" id="ecraLogin">
  <div class="login-box">
    <h1>🔒 SE &amp; S</h1>
    <p>Registo de Ponto — Obras</p>
    <input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Password" autocomplete="current-password">
    <button onclick="fazerLogin()">Entrar</button>
    <div class="login-erro" id="loginErro">E-mail ou password incorretos</div>
  </div>
</div>

<!-- ==================== APP ==================== -->
<div class="app" id="app" style="display:none">

  <h2>🏗️ SE &amp; S — Registo de Ponto</h2>
  <div class="sync-status sync-off" id="syncStatus">⏳ A ligar...</div>

  <div class="tabs">
    <div class="tab ativo" id="tabPonto" onclick="mudarTab('ponto')">📝 Ponto</div>
    <div class="tab" id="tabRegistos" onclick="mudarTab('registos')">📋 Registos</div>
    <div class="tab" id="tabGestao" onclick="mudarTab('gestao')">⚙️ Gestão</div>
  </div>

  <!-- ===== PONTO ===== -->
  <div id="secPonto">
    <div class="card" id="cardForm">
      <label>Obra</label>
      <select id="obra"></select>

      <label>Trabalhador</label>
      <select id="trabalhador"></select>

      <label>Data</label>
      <input type="date" id="data">

      <div class="linha2">
        <div><label>Entrada</label><input type="time" id="entrada"></div>
        <div><label>Saída</label><input type="time" id="saida"></div>
      </div>
      <div class="linha2">
        <div><label>Início pausa</label><input type="time" id="pausaIni"></div>
        <div><label>Fim pausa</label><input type="time" id="pausaFim"></div>
      </div>

      <label>Observações</label>
      <input type="text" id="obs" placeholder="opcional">

      <button class="btn-verde" id="btnGuardar" onclick="guardarRegisto()">➕ Guardar registo</button>
      <button class="btn-cinza" id="btnCancelar" style="display:none" onclick="cancelarEdicao()">✖️ Cancelar edição</button>
      <button class="btn-laranja" onclick="registoRapido()">⚡ Mesmo dia/obra — outro trabalhador</button>
    </div>
  </div>

  <!-- ===== REGISTOS ===== -->
  <div id="secRegistos" style="display:none">
    <div class="card card-filtros">
      <label>Obra</label>
      <select id="filtroObra" onchange="mostrarRegistos()"><option value="">— todas —</option></select>
      <label>Trabalhador</label>
      <select id="filtroTrab" onchange="mostrarRegistos()"><option value="">— todos —</option></select>
      <label>Mês</label>
      <select id="filtroMes" onchange="mostrarRegistos()"><option value="">— todos —</option></select>
    </div>

    <div class="resumo" id="resumo">Total: 0h 0m</div>
    <div id="listaRegistos"></div>

    <button onclick="window.print()">🖨️ Guardar em PDF</button>
    <button class="btn-cinza" onclick="exportarCSV()">📊 Exportar Excel</button>
    <button class="btn-laranja" onclick="sincronizar(true)">🔄 Forçar sincronização</button>
  </div>

  <!-- ===== GESTÃO ===== -->
  <div id="secGestao" style="display:none">
    <div class="card">
      <h2>👷 Trabalhadores</h2>
      <div id="listaTrabalhadores"></div>
      <label>Adicionar trabalhador</label>
      <input type="text" id="novoTrab" placeholder="Nome do trabalhador">
      <button class="btn-verde" onclick="addTrab()">➕ Adicionar</button>
    </div>

    <div class="card">
      <h2>🏗️ Obras</h2>
      <div id="listaObras"></div>
      <label>Adicionar obra</label>
      <input type="text" id="novaObra" placeholder="Nome da obra">
      <button class="btn-verde" onclick="addObra()">➕ Adicionar</button>
    </div>

    <div class="card">
      <h2>💾 Cópia de segurança</h2>
      <button class="btn-cinza" onclick="backupJSON()">📤 Descarregar todos os dados</button>
      <button class="btn-laranja" onclick="document.getElementById('ficheiroRestore').click()">📥 Repor dados de um backup</button>
      <input type="file" id="ficheiroRestore" accept=".json,application/json" style="display:none" onchange="reporBackup(event)">
    </div>

    <div class="card">
      <h2>🚪 Sessão</h2>
      <button class="btn-cinza" onclick="sair()">Sair da conta</button>
    </div>

    <div class="card">
      <h2>🗑️ Limpar dados</h2>
      <button class="btn-vermelho" onclick="limparTudo()">Apagar todos os registos</button>
    </div>
  </div>
</div>

<!-- ==================== FIREBASE ==================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ============ CONFIG FIREBASE ============
const firebaseConfig = {
  apiKey: "AIzaSyCa5d8W7qhuLDyXdhCPIOEHy9LIWGxgGKM",
  authDomain: "ponto-ses.firebaseapp.com",
  projectId: "ponto-ses",
  storageBucket: "ponto-ses.firebasestorage.app",
  messagingSenderId: "513482051686",
  appId: "1:513482051686:web:8b30422e121edf9df45da7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============ ESTADO LOCAL ============
let trabalhadores = [];
let obras = [];
let registos = [];
let apagadosPendentes = [];
let configAlterada = false;
let editandoId = null;
let aSincronizar = false;

function novoId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

// ============ CARREGAR / GUARDAR LOCAL ============
function carregarLocal() {
  trabalhadores = JSON.parse(localStorage.getItem('rp_trabalhadores') || 'null');
  obras = JSON.parse(localStorage.getItem('rp_obras') || 'null');
  registos = JSON.parse(localStorage.getItem('rp_registos') || 'null');
  apagadosPendentes = JSON.parse(localStorage.getItem('rp_apagados') || '[]');
  configAlterada = localStorage.getItem('rp_configAlt') === '1';

  if (!trabalhadores) trabalhadores = JSON.parse(localStorage.getItem('trabalhadores') || 'null') || ['Paulo Torres','Rui Pimentel','João Gonçalves'];
  if (!obras) obras = JSON.parse(localStorage.getItem('obras') || 'null') || ['Hotel Vale do Tempo','Auchan Faro'];

  if (!registos) {
    const antigos = JSON.parse(localStorage.getItem('registosPonto') || '[]');
    registos = antigos.map(r => ({
      id: novoId(),
      obra: r.obra || '', trab: r.trab || '', data: r.data || '',
      entrada: r.entrada || '', saida: r.saida || '',
      pausaIni: r.pausaIni || '', pausaFim: r.pausaFim || '',
      obs: r.obs || '', total: r.total || 0,
      synced: false
    }));
    if (antigos.length) salvarLocal();
  }
}

function salvarLocal() {
  localStorage.setItem('rp_trabalhadores', JSON.stringify(trabalhadores));
  localStorage.setItem('rp_obras', JSON.stringify(obras));
  localStorage.setItem('rp_registos', JSON.stringify(registos));
  localStorage.setItem('rp_apagados', JSON.stringify(apagadosPendentes));
  localStorage.setItem('rp_configAlt', configAlterada ? '1' : '0');
}

// ============ AUTENTICAÇÃO ============
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('ecraLogin').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    arrancar();
  } else {
    document.getElementById('ecraLogin').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

function fazerLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  document.getElementById('loginErro').style.display = 'none';
  auth.signInWithEmailAndPassword(email, pass).catch(() => {
    document.getElementById('loginErro').style.display = 'block';
    document.getElementById('loginPass').value = '';
  });
}

function sair() {
  if (confirm('Sair da conta?')) auth.signOut();
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

// ============ STATUS ============
function setStatus(tipo, msg) {
  const el = document.getElementById('syncStatus');
  el.className = 'sync-status ' + tipo;
  el.textContent = msg;
}

function pendentes() {
  return registos.filter(r => !r.synced).length + apagadosPendentes.length;
}

function atualizarStatusOffline() {
  const p = pendentes();
  if (navigator.onLine === false) {
    setStatus('sync-off', '📱 Sem internet — ' + p + ' por sincronizar');
  } else if (p > 0) {
    setStatus('sync-off', '⏳ ' + p + ' por sincronizar');
  } else {
    setStatus('sync-ok', '☁️ Sincronizado');
  }
}

// ============ SINCRONIZAÇÃO ============
async function sincronizar(manual) {
  if (aSincronizar) return;
  if (!auth.currentUser) return;
  aSincronizar = true;
  if (manual) setStatus('sync-off', '⏳ A sincronizar...');

  try {
    if (configAlterada) {
      await db.collection('config').doc('geral').set({ trabalhadores, obras });
      configAlterada = false;
    }

    for (const id of apagadosPendentes) {
      await db.collection('registos').doc(id).delete();
    }
    apagadosPendentes = [];

    for (const r of registos.filter(x => !x.synced)) {
      const dados = { obra:r.obra, trab:r.trab, data:r.data, entrada:r.entrada, saida:r.saida,
                      pausaIni:r.pausaIni, pausaFim:r.pausaFim, obs:r.obs, total:r.total };
      await db.collection('registos').doc(r.id).set(dados);
      r.synced = true;
    }

    if (!configAlterada) {
      const cfg = await db.collection('config').doc('geral').get();
      if (cfg.exists) {
        const d = cfg.data();
        if (d.trabalhadores) trabalhadores = d.trabalhadores;
        if (d.obras) obras = d.obras;
      } else {
        await db.collection('config').doc('geral').set({ trabalhadores, obras });
      }
    }

    const snap = await db.collection('registos').get();
    const remotos = {};
    snap.forEach(doc => { remotos[doc.id] = Object.assign(doc.data(), { id: doc.id, synced: true }); });
    const locaisPendentes = registos.filter(r => !r.synced);
    registos = Object.values(remotos);
    locaisPendentes.forEach(p => { if (!remotos[p.id]) registos.push(p); });

    salvarLocal();
    preencherSelects();
    mostrarRegistos();
    atualizarStatusOffline();
  } catch (e) {
    console.log('Erro sync:', e);
    setStatus('sync-err', '📱 Offline — dados seguros no telemóvel');
  }
  aSincronizar = false;
}

window.addEventListener('online', () => sincronizar());
window.addEventListener('offline', () => atualizarStatusOffline());

// ============ ARRANQUE ============
function arrancar() {
  carregarLocal();
  document.getElementById('data').valueAsDate = new Date();
  preencherSelects();
  mostrarRegistos();
  atualizarStatusOffline();
  sincronizar();
}

// ============ TABS ============
function mudarTab(tab) {
  document.getElementById('secPonto').style.display = tab === 'ponto' ? 'block' : 'none';
  document.getElementById('secRegistos').style.display = tab === 'registos' ? 'block' : 'none';
  document.getElementById('secGestao').style.display = tab === 'gestao' ? 'block' : 'none';
  document.getElementById('tabPonto').className = 'tab' + (tab === 'ponto' ? ' ativo' : '');
  document.getElementById('tabRegistos').className = 'tab' + (tab === 'registos' ? ' ativo' : '');
  document.getElementById('tabGestao').className = 'tab' + (tab === 'gestao' ? ' ativo' : '');
  if (tab === 'registos') mostrarRegistos();
  if (tab === 'gestao') mostrarGestao();
}

// ============ SELECTS ============
function preencherSelects() {
  const pares = [
    ['obra', '— escolher obra —', obras],
    ['filtroObra', '— todas —', obras],
    ['trabalhador', '— escolher trabalhador —', trabalhadores],
    ['filtroTrab', '— todos —', trabalhadores]
  ];
  pares.forEach(([id, vazio, lista]) => {
    const sel = document.getElementById(id);
    const val = sel.value;
    sel.innerHTML = `<option value="">${vazio}</option>`;
    lista.forEach(x => sel.innerHTML += `<option value="${x}">${x}</option>`);
    sel.value = val;
  });

  const meses = [...new Set(registos.map(r => r.data).filter(d => d).map(d => d.slice(0, 7)))].sort().reverse();
  const nomesMes = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const selMes = document.getElementById('filtroMes');
  const valMes = selMes.value;
  selMes.innerHTML = '<option value="">— todos —</option>';
  meses.forEach(m => {
    const [a, mm] = m.split('-');
    selMes.innerHTML += `<option value="${m}">${nomesMes[parseInt(mm)-1]} ${a}</option>`;
  });
  selMes.value = valMes;
}

// ============ CÁLCULOS ============
function minutos(h1, h2) {
  if (!h1 || !h2) return 0;
  const [a, b] = h1.split(':').map(Number);
  const [c, d] = h2.split(':').map(Number);
  let dif = (c * 60 + d) - (a * 60 + b);
  if (dif < 0) dif += 24 * 60;
  return dif;
}

function fmt(m) {
  if (m < 0) m = 0;
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}

function dataFmt(d) {
  return d ? d.split('-').reverse().join('/') : '';
}

// ============ GUARDAR / EDITAR ============
function guardarRegisto() {
  const obra = document.getElementById('obra').value;
  const trab = document.getElementById('trabalhador').value;
  const data = document.getElementById('data').value;
  const entrada = document.getElementById('entrada').value;
  const saida = document.getElementById('saida').value;
  const pausaIni = document.getElementById('pausaIni').value;
  const pausaFim = document.getElementById('pausaFim').value;
  const obs = document.getElementById('obs').value.trim();

  if (!obra) { alert('Escolhe uma obra.'); return; }
  if (!trab) { alert('Escolhe um trabalhador.'); return; }
  if (!data) { alert('Escolhe a data.'); return; }
  if (!entrada || !saida) { alert('Preenche entrada e saída.'); return; }

  const total = minutos(entrada, saida) - minutos(pausaIni, pausaFim);

  if (editandoId) {
    const r = registos.find(x => x.id === editandoId);
    if (r) {
      Object.assign(r, { obra, trab, data, entrada, saida, pausaIni, pausaFim, obs, total, synced: false });
    }
    editandoId = null;
    document.getElementById('btnGuardar').textContent = '➕ Guardar registo';
    document.getElementById('btnCancelar').style.display = 'none';
    document.getElementById('cardForm').classList.remove('editando');
  } else {
    registos.push({ id: novoId(), obra, trab, data, entrada, saida, pausaIni, pausaFim, obs, total, synced: false });
  }

  salvarLocal();
  limparForm();
  preencherSelects();
  atualizarStatusOffline();
  sincronizar();
  alert('✅ Registo guardado!');
}

function limparForm() {
  document.getElementById('entrada').value = '';
  document.getElementById('saida').value = '';
  document.getElementById('pausaIni').value = '';
  document.getElementById('pausaFim').value = '';
  document.getElementById('obs').value = '';
}

function editarRegisto(id) {
  const r = registos.find(x => x.id === id);
  if (!r) return;
  editandoId = id;
  document.getElementById('obra').value = r.obra;
  document.getElementById('trabalhador').value = r.trab;
  document.getElementById('data').value = r.data;
  document.getElementById('entrada').value = r.entrada;
  document.getElementById('saida').value = r.saida;
  document.getElementById('pausaIni').value = r.pausaIni;
  document.getElementById('pausaFim').value = r.pausaFim;
  document.getElementById('obs').value = r.obs;
  document.getElementById('btnGuardar').textContent = '💾 Guardar alterações';
  document.getElementById('btnCancelar').style.display = 'block';
  document.getElementById('cardForm').classList.add('editando');
  mudarTab('ponto');
}

function cancelarEdicao() {
  editandoId = null;
  document.getElementById('btnGuardar').textContent = '➕ Guardar registo';
  document.getElementById('btnCancelar').style.display = 'none';
  document.getElementById('cardForm').classList.remove('editando');
  limparForm();
}

function registoRapido() {
  if (!document.getElementById('obra').value || !document.getElementById('data').value) {
    alert('Preenche primeiro a obra e a data.');
    return;
  }
  document.getElementById('trabalhador').value = '';
  document.getElementById('trabalhador').focus();
}

function apagarRegisto(id) {
  if (!confirm('Apagar este registo?')) return;
  apagadosPendentes.push(id);
  registos = registos.filter(r => r.id !== id);
  salvarLocal();
  mostrarRegistos();
  preencherSelects();
  atualizarStatusOffline();
  sincronizar();
}

// ============ MOSTRAR REGISTOS ============
function mostrarRegistos() {
  const fObra = document.getElementById('filtroObra').value;
  const fTrab = document.getElementById('filtroTrab').value;
  const fMes = document.getElementById('filtroMes').value;
  const div = document.getElementById('listaRegistos');
  div.innerHTML = '';
  let soma = 0;

  const filtrados = registos.filter(r => {
    if (fObra && r.obra !== fObra) return false;
    if (fTrab && r.trab !== fTrab) return false;
    if (fMes && !r.data.startsWith(fMes)) return false;
    return true;
  }).sort((a, b) => b.data.localeCompare(a.data) || a.trab.localeCompare(b.trab));

  filtrados.forEach(r => {
    soma += r.total;
    const pausaTxt = (r.pausaIni && r.pausaFim) ? ` · ☕ ${r.pausaIni}-${r.pausaFim}` : '';
    const pendente = r.synced ? '' : ' 🟠';
    div.innerHTML += `
      <div class="registo ${r.synced ? '' : 'nsync'}">
        <div class="acoes">
          <button class="btn-pequeno btn-laranja" onclick="editarRegisto('${r.id}')">✏️</button>
          <button class="btn-pequeno btn-vermelho" onclick="apagarRegisto('${r.id}')">🗑️</button>
        </div>
        <div class="obra">🏗️ ${r.obra}</div>
        <div class="trab">👷 ${r.trab}</div>
        <div class="data">📅 ${dataFmt(r.data)}${pendente}</div>
        <div class="horas">🕐 ${r.entrada} → ${r.saida}${pausaTxt}</div>
        <div class="horas tot">✅ ${fmt(r.total)}</div>
        ${r.obs ? `<div class="obs">📝 ${r.obs}</div>` : ''}
      </div>`;
  });

  if (filtrados.length === 0) {
    div.innerHTML = '<div class="card" style="text-align:center;color:#888;">Sem registos.</div>';
  }

  const porTrab = {}, porObra = {};
  filtrados.forEach(r => {
    porTrab[r.trab] = (porTrab[r.trab] || 0) + r.total;
    porObra[r.obra] = (porObra[r.obra] || 0) + r.total;
  });

  let html = `Total: ${fmt(soma)} (${filtrados.length} registos)`;

  function tabela(titulo, obj) {
    let t = `<table class="tabela-resumo"><tr><th>${titulo}</th><th>Horas</th></tr>`;
    Object.keys(obj).sort().forEach(k => t += `<tr><td>${k}</td><td>${fmt(obj[k])}</td></tr>`);
    t += `<tr><td>TOTAL</td><td>${fmt(soma)}</td></tr></table>`;
    return t;
  }
  if (Object.keys(porTrab).length > 1) html += tabela('👷 Trabalhador', porTrab);
  if (Object.keys(porObra).length > 1) html += tabela('🏗️ Obra', porObra);

  document.getElementById('resumo').innerHTML = html;
}

// ============ GESTÃO ============
function mostrarGestao() {
  const divT = document.getElementById('listaTrabalhadores');
  divT.innerHTML = trabalhadores.map((t, i) => `
    <div class="item-lista">
      <span>👷 ${t}</span>
      <div>
        <button class="btn-pequeno btn-laranja" onclick="editarTrab(${i})">✏️</button>
        <button class="btn-pequeno btn-vermelho" onclick="removerTrab(${i})">🗑️</button>
      </div>
    </div>`).join('') || '<div style="color:#888">Sem trabalhadores.</div>';

  const divO = document.getElementById('listaObras');
  divO.innerHTML = obras.map((o, i) => `
    <div class="item-lista">
      <span>🏗️ ${o}</span>
      <div>
        <button class="btn-pequeno btn-laranja" onclick="editarObra(${i})">✏️</button>
        <button class="btn-pequeno btn-vermelho" onclick="removerObra(${i})">🗑️</button>
      </div>
    </div>`).join('') || '<div style="color:#888">Sem obras.</div>';
}

function configMudou() {
  configAlterada = true;
  salvarLocal();
  preencherSelects();
  mostrarGestao();
  sincronizar();
}

function addTrab() {
  const nome = document.getElementById('novoTrab').value.trim();
  if (!nome) return alert('Escreve o nome.');
  if (trabalhadores.includes(nome)) return alert('Já existe.');
  trabalhadores.push(nome);
  document.getElementById('novoTrab').value = '';
  configMudou();
}

function editarTrab(i) {
  const novo = prompt('Novo nome:', trabalhadores[i]);
  if (novo && novo.trim()) {
    const antigo = trabalhadores[i];
    trabalhadores[i] = novo.trim();
    registos.forEach(r => { if (r.trab === antigo) { r.trab = novo.trim(); r.synced = false; } });
    configMudou();
  }
}

function removerTrab(i) {
  if (confirm('Remover ' + trabalhadores[i] + '? (os registos dele mantêm-se)')) {
    trabalhadores.splice(i, 1);
    configMudou();
  }
}

function addObra() {
  const nome = document.getElementById('novaObra').value.trim();
  if (!nome) return alert('Escreve o nome.');
  if (obras.includes(nome)) return alert('Já existe.');
  obras.push(nome);
  document.getElementById('novaObra').value = '';
  configMudou();
}

function editarObra(i) {
  const novo = prompt('Novo nome:', obras[i]);
  if (novo && novo.trim()) {
    const antigo = obras[i];
    obras[i] = novo.trim();
    registos.forEach(r => { if (r.obra === antigo) { r.obra = novo.trim(); r.synced = false; } });
    configMudou();
  }
}

function removerObra(i) {
  if (confirm('Remover ' + obras[i] + '? (os registos dela mantêm-se)')) {
    obras.splice(i, 1);
    configMudou();
  }
}

function limparTudo() {
  if (!confirm('Tens a certeza? Apaga TODOS os registos!')) return;
  if (!confirm('Última confirmação — apagar tudo?')) return;
  registos.forEach(r => apagadosPendentes.push(r.id));
  registos = [];
  salvarLocal();
  mostrarRegistos();
  preencherSelects();
  sincronizar();
  alert('Todos os registos foram apagados.');
}

// ============ BACKUP E RESTAURO ============
function backupJSON() {
  const dados = { trabalhadores, obras, registos, exportadoEm: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'backup_ponto.json';
  a.click();
}

function reporBackup(event) {
  const ficheiro = event.target.files[0];
  if (!ficheiro) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const dados = JSON.parse(e.target.result);

      // Validar se é mesmo um backup desta app
      if (!dados.registos || !Array.isArray(dados.registos)) {
        alert('❌ Ficheiro inválido.\nNão parece ser um backup do registo de ponto.');
        return;
      }

      const nReg = dados.registos.length;
      const nTrab = (dados.trabalhadores || []).length;
      const nObras = (dados.obras || []).length;

      if (!confirm('Encontrei neste backup:\n\n👷 ' + nTrab + ' trabalhadores\n🏗️ ' + nObras + ' obras\n📝 ' + nReg + ' registos\n\nIsto vai SUBSTITUIR os dados atuais.\n\nContinuar?')) {
        return;
      }

      // Repor trabalhadores e obras
      trabalhadores = dados.trabalhadores || [];
      obras = dados.obras || [];

      // Repor registos (marcar todos para enviar para a nuvem)
      registos = dados.registos.map(r => ({
        id: r.id || novoId(),
        obra: r.obra || '',
        trab: r.trab || '',
        data: r.data || '',
        entrada: r.entrada || '',
        saida: r.saida || '',
        pausaIni: r.pausaIni || '',
        pausaFim: r.pausaFim || '',
        obs: r.obs || '',
        total: r.total || 0,
        synced: false
      }));

      // Limpar a lista de apagados para não apagar os registos repostos
      apagadosPendentes = [];
      configAlterada = true;

      salvarLocal();
      preencherSelects();
      mostrarRegistos();
      atualizarStatusOffline();
      sincronizar();

      alert('✅ Dados repostos com sucesso!\n\n' + nReg + ' registos recuperados.');

    } catch (erro) {
      alert('❌ Erro ao ler o ficheiro.\nTens a certeza que é o backup_ponto.json?');
      console.log('Erro no restauro:', erro);
    }
  };
  reader.readAsText(ficheiro);

  // Limpar para permitir escolher o mesmo ficheiro outra vez
  event.target.value = '';
}

// ============ EXPORTAR CSV ============
function exportarCSV() {
  if (registos.length === 0) return alert('Sem registos.');
  let csv = 'Obra;Trabalhador;Data;Entrada;Saida;Pausa Inicio;Pausa Fim;Total;Observacoes\n';
  registos.slice().sort((a,b) => a.data.localeCompare(b.data)).forEach(r => {
    csv += `${r.obra};${r.trab};${dataFmt(r.data)};${r.entrada};${r.saida};${r.pausaIni||''};${r.pausaFim||''};${fmt(r.total)};${(r.obs||'').replace(/;/g, ',')}\n`;
  });
  const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'registo_ponto.csv';
  a.click();
}

// ============ INICIAR ============
carregarLocal();
</script>
